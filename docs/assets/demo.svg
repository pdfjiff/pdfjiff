<svg xmlns="http://www.w3.org/2000/svg" width="605" height="612" viewBox="0 0 605 612" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">pdfjiff compressing and merging PDFs</title>
<desc id="desc">A real terminal session: a 17 MB report.pdf is compressed to 1.6 MB with pdfjiff compress, then merged with an appendix using pdfjiff merge.</desc>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:14px;white-space:pre}.p{fill:#7ee787}.c{fill:#e6edf3}.o{fill:#b1bac4}.ok{fill:#79c0ff}.k{fill:#d2a8ff}.n{fill:#ffa657}</style>
<rect width="605" height="612" rx="10" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="604" height="611" rx="10" fill="none" stroke="#30363d"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="24" y="48" xml:space="preserve"><tspan class="p">$</tspan><tspan class="c"> du -h report.pdf</tspan></text>
<text x="24" y="68" xml:space="preserve"><tspan class="o">17M     report.pdf</tspan></text>
<text x="24" y="88" xml:space="preserve"><tspan class="p">$</tspan><tspan class="c"> pdfjiff compress report.pdf</tspan></text>
<text x="24" y="108" xml:space="preserve"><tspan class="ok">pdf.compress:</tspan><tspan class="p"> succeeded</tspan></text>
<text x="24" y="128" xml:space="preserve"><tspan class="o">Output: /home/you/docs/report-compressed.pdf</tspan></text>
<text x="24" y="148" xml:space="preserve"><tspan class="o">{</tspan></text>
<text x="24" y="168" xml:space="preserve"><tspan class="o">  </tspan><tspan class="k">"attempts"</tspan><tspan class="o">: </tspan><tspan class="n">1,</tspan></text>
<text x="24" y="188" xml:space="preserve"><tspan class="o">  </tspan><tspan class="k">"elapsed_ms"</tspan><tspan class="o">: </tspan><tspan class="n">2609.071112,</tspan></text>
<text x="24" y="208" xml:space="preserve"><tspan class="o">  </tspan><tspan class="k">"images_downsampled"</tspan><tspan class="o">: </tspan><tspan class="n">6,</tspan></text>
<text x="24" y="228" xml:space="preserve"><tspan class="o">  </tspan><tspan class="k">"images_recompressed"</tspan><tspan class="o">: </tspan><tspan class="n">6,</tspan></text>
<text x="24" y="248" xml:space="preserve"><tspan class="o">  </tspan><tspan class="k">"input_bytes"</tspan><tspan class="o">: </tspan><tspan class="n">17583450,</tspan></text>
<text x="24" y="268" xml:space="preserve"><tspan class="o">  </tspan><tspan class="k">"output_bytes"</tspan><tspan class="o">: </tspan><tspan class="n">1620863,</tspan></text>
<text x="24" y="288" xml:space="preserve"><tspan class="o">  </tspan><tspan class="k">"pages"</tspan><tspan class="o">: </tspan><tspan class="n">6,</tspan></text>
<text x="24" y="308" xml:space="preserve"><tspan class="o">  </tspan><tspan class="k">"target_bytes"</tspan><tspan class="o">: </tspan><tspan class="n">null,</tspan></text>
<text x="24" y="328" xml:space="preserve"><tspan class="o">  </tspan><tspan class="k">"target_reached"</tspan><tspan class="o">: </tspan><tspan class="n">null</tspan></text>
<text x="24" y="348" xml:space="preserve"><tspan class="o">}</tspan></text>
<text x="24" y="368" xml:space="preserve"><tspan class="p">$</tspan><tspan class="c"> du -h report-compressed.pdf</tspan></text>
<text x="24" y="388" xml:space="preserve"><tspan class="o">1.6M    report-compressed.pdf</tspan></text>
<text x="24" y="408" xml:space="preserve"><tspan class="p">$</tspan><tspan class="c"> pdfjiff merge report-compressed.pdf appendix.pdf -o survey.pdf</tspan></text>
<text x="24" y="428" xml:space="preserve"><tspan class="ok">pdf.merge:</tspan><tspan class="p"> succeeded</tspan></text>
<text x="24" y="448" xml:space="preserve"><tspan class="o">Output: /home/you/docs/survey.pdf</tspan></text>
<text x="24" y="468" xml:space="preserve"><tspan class="o">{</tspan></text>
<text x="24" y="488" xml:space="preserve"><tspan class="o">  </tspan><tspan class="k">"elapsed_ms"</tspan><tspan class="o">: </tspan><tspan class="n">8.583483,</tspan></text>
<text x="24" y="508" xml:space="preserve"><tspan class="o">  </tspan><tspan class="k">"input_bytes"</tspan><tspan class="o">: </tspan><tspan class="n">1623289,</tspan></text>
<text x="24" y="528" xml:space="preserve"><tspan class="o">  </tspan><tspan class="k">"output_bytes"</tspan><tspan class="o">: </tspan><tspan class="n">1623364,</tspan></text>
<text x="24" y="548" xml:space="preserve"><tspan class="o">  </tspan><tspan class="k">"pages"</tspan><tspan class="o">: </tspan><tspan class="n">8</tspan></text>
<text x="24" y="568" xml:space="preserve"><tspan class="o">}</tspan></text>
</svg>
