[package]
name = "pdfjiff-cli"
description = "Fast, local PDF inspection, compression and merging from the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["pdf", "cli", "compress", "merge", "pdf-tools"]
categories = ["command-line-utilities", "compression"]

[[bin]]
name = "pdfjiff"
path = "src/main.rs"

[dependencies]
pdfjiff-core.workspace = true
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
same-file = "1"
ctrlc = "3"

[dev-dependencies]
lopdf = { version = "0.44", default-features = false }

# `cargo binstall pdfjiff-cli` downloads the prebuilt release archive.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/pdfjiff-{ target }.tar.gz"
bin-dir = "pdfjiff-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/pdfjiff-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/pdfjiff-{ target }.zip"
pkg-fmt = "zip"
