name: Feature request
description: Suggest a new command, option or improvement
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and why it matters, not only the solution. For example, "I need to split scanned contracts into one PDF per signature page".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like pdfjiff to do?
      description: Show the command you imagine running and the result you'd expect.
      render: shell
  - type: textarea
    id: alternatives
    attributes:
      label: What do you use today?
      description: Other tools or workarounds, and where they fall short.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself (a maintainer will help scope it).
