# Cut a release: set the version in Cargo.toml and a dated CHANGELOG section,
# then push a tag `vX.Y.Z`. See docs/releasing.md.
#
# Always: build 6 targets -> GitHub release (archives, SHA256SUMS, installers,
#         provenance attestations) -> Docker image on GHCR -> move the `vN` tag
#         -> install the release through every public channel (installers.yml).
# Opt-in: crates.io (vars.PUBLISH_CRATES), Homebrew tap (vars.HOMEBREW_TAP),
#         Scoop bucket (vars.SCOOP_BUCKET). Each is skipped until configured.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.0
        required: true

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  plan:
    name: Check version and changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - id: check
        run: |
          version="$(python3 .github/scripts/release_tools.py check-tag "$TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
          python3 .github/scripts/release_tools.py notes "$version" > notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: notes.md

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, run: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, run: true }
          - { target: aarch64-apple-darwin, os: macos-latest, run: true }
          - { target: x86_64-apple-darwin, os: macos-latest, run: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, run: true }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, run: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo build --release --locked -p pdfjiff-cli --target "${{ matrix.target }}"
      - name: Smoke test
        if: matrix.run
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bin="target/${{ matrix.target }}/release/pdfjiff"
          "$bin" --version | grep -F "$VERSION"
          "$bin" capabilities --json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/pdfjiff
            target/${{ matrix.target }}/release/pdfjiff.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: bins
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-about
      - name: Third-party license notices
        run: |
          cargo about generate --locked --fail -o THIRD-PARTY-LICENSES.md about.hbs
          test -s THIRD-PARTY-LICENSES.md
      - name: Package archives and checksums
        run: |
          for dir in bins/bin-*; do
            target="${dir#bins/bin-}"
            binary="$(find "$dir" -maxdepth 1 -type f \( -name pdfjiff -o -name pdfjiff.exe \))"
            python3 .github/scripts/release_tools.py package "$target" "$binary" dist
          done
          cp install.sh install.ps1 THIRD-PARTY-LICENSES.md dist/
          python3 .github/scripts/release_tools.py checksums dist
          cat dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/pdfjiff-*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" dist/* --verify-tag --title "PDFJiff $VERSION" \
            --notes-file notes.md --generate-notes "${flags[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist

  docker:
    name: Docker image
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*-linux-musl
          path: bins
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist-release
      - name: Arrange binaries by platform
        run: |
          cp dist-release/THIRD-PARTY-LICENSES.md .
          install -D -m 755 bins/bin-x86_64-unknown-linux-musl/pdfjiff dist/docker/linux/amd64/pdfjiff
          install -D -m 755 bins/bin-aarch64-unknown-linux-musl/pdfjiff dist/docker/linux/arm64/pdfjiff
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=${{ needs.plan.outputs.prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ needs.plan.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=pdfjiff
            org.opencontainers.image.description=Fast, private PDF compression, merging and inspection
            org.opencontainers.image.licenses=MIT OR Apache-2.0
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  crates:
    name: Publish to crates.io
    needs: [plan, publish]
    if: vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - name: Authenticate (trusted publishing)
        id: auth
        if: env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

  homebrew:
    name: Update Homebrew tap
    needs: [plan, publish]
    if: vars.HOMEBREW_TAP != '' && needs.plan.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      # Credentials stay configured so this job can push the update; nothing is uploaded afterwards.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.HOMEBREW_TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap # zizmor: ignore[artipacked]
      - name: Commit formula
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p tap/Formula
          python3 .github/scripts/release_tools.py homebrew "$VERSION" dist/SHA256SUMS > tap/Formula/pdfjiff.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pdfjiff.rb
          git diff --cached --quiet && { echo "Formula already up to date."; exit 0; }
          git commit -m "pdfjiff $VERSION"
          git push

  scoop:
    name: Update Scoop bucket
    needs: [plan, publish]
    if: vars.SCOOP_BUCKET != '' && needs.plan.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      # Credentials stay configured so this job can push the update; nothing is uploaded afterwards.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.SCOOP_BUCKET }}
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: bucket # zizmor: ignore[artipacked]
      - name: Commit manifest
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p bucket/bucket
          python3 .github/scripts/release_tools.py scoop "$VERSION" dist/SHA256SUMS > bucket/bucket/pdfjiff.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/pdfjiff.json
          git diff --cached --quiet && { echo "Manifest already up to date."; exit 0; }
          git commit -m "pdfjiff: Update to version $VERSION"
          git push

  action-tag:
    name: Move the major-version tag for the GitHub Action
    needs: [plan, publish]
    if: needs.plan.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Credentials stay configured so this job can push the tag; nothing is uploaded afterwards.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }} # zizmor: ignore[artipacked]
      - name: Point vMAJOR at this release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          major="v${VERSION%%.*}"
          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"

  verify:
    name: Verify published install paths
    needs: [publish, docker, homebrew, scoop, action-tag]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/installers.yml
