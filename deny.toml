# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`. CI runs the same checks on every PR.

[graph]
all-features = true

[advisories]
# RustSec advisories fail the build; yanked crates are reported as errors too.
yanked = "deny"
ignore = []

[licenses]
# Every dependency must be available under at least one of these licenses,
# all of which are compatible with shipping PDFJiff as MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
